; ==============================================================================
; Prosperous Alchemist NG — Configuration File
; ==============================================================================

[General]

; ------------------------------------------------------------------------------
; Calculation Settings
; ------------------------------------------------------------------------------

; IgnorePlayer:
;   0 = Use the player's Alchemy skill level, perks, and active Fortify Alchemy
;       equipment/potion buffs when calculating recipe values. (Default)
;   1 = Ignore player character stats and evaluate base recipe value.
IgnorePlayer = 0

; Singlethreaded:
;   0 = Recipe evaluation uses worker threads. (Default, recommended)
;   1 = Recipe evaluation runs on the main thread.
Singlethreaded = 0

; CacheDurationSeconds:
;   Retention time in seconds for the master recipe cache after closing the alchemy menu.
;   Within this time window, reopening the alchemy lab reuses the cache instantly (< 1 ms)
;   for subsets of known ingredients. Default is 180 seconds (3 minutes).
CacheDurationSeconds = 180

; StaleRecalculateThresholdMs:
;   Threshold in milliseconds above which automatic heavy recalculations during crafting
;   are suppressed. Depleted ingredients are dropped instantly (< 1 ms), while a manual
;   [Recalculate] button appears in the UI when player stats or ingredients change.
;   0 disables the guard and always auto-recalculates. Default is 500 ms (0.5 s).
StaleRecalculateThresholdMs = 500

; CraftDebounceMs:
;   Trailing-edge debounce interval in milliseconds for rapid crafting bursts.
;   Postpones background re-evaluation until the user pauses crafting. Default is 400 ms.
CraftDebounceMs = 400

; FilterPotionsBySelectedIngredients:
;   0 = Show all calculated potions in the overlay.
;   1 = Show only potions containing every ingredient currently selected in the Skyrim
;       alchemy menu. With no ingredients selected, all calculated potions are shown.
;       The selected potion remains selected when this filter temporarily hides it.
FilterPotionsBySelectedIngredients = 1

; ProtectIngredients:
;   0 = Allow all ingredients in the player's inventory to be used in recipes.
;   1 = Enable the unified ingredient protection and tracking system. This protects
;       the configured list, enough ingredients for two of every loaded craftable
;       item, selected ingredient effects, and unfinished tracking requirements.
;       (Default is 0.)
ProtectIngredients = 0

; ProtectedIngredients:
;   Comma-separated list of ingredients to exclude when ProtectIngredients=1.
;   Entries can be ingredient names, editor IDs, or hexadecimal FormIDs (e.g. 0x0001BCBC).
;   An optional quantity threshold (e.g. |3) preserves at least that many in inventory
;   while allowing surplus to be used. The default list is empty; selected effects are
;   configured separately under [Tracking].
ProtectedIngredients =

[Tracking]

; ManualProtectionOnly:
;   0 = Include automatic quest and craftable reservations along with manual, custom,
;       and selected protected-effect entries. (Default)
;   1 = Use only manual/custom reservations and selected protected effects. Automatic
;       quest and craftable reservations remain stored but do not protect ingredients.
ManualProtectionOnly = 0

; ProtectedEffects:
;   Comma-separated ingredient effect names, editor IDs, or FormIDs to protect.
;   The default Fortify Enchanting and Fortify Smithing selections protect all matching
;   copies initially. The selected effect rows on the Track page can change each effect
;   to a finite quantity per ingredient; individual ingredient details can still override
;   a specific detected source.
ProtectedEffects = Fortify Enchanting,Fortify Smithing

; ProtectedEffectCounts:
;   Automatically maintained finite quantity defaults for selected effects. The value is
;   a comma-separated list of effect FormID keys and quantities, such as 0x00000001|3.
;   The Track page is the supported way to edit this value; an absent entry means protect all.
ProtectedEffectCounts =

; Requirements:
;   Automatically maintained manual/detected tracking requirements. Edit this
;   value through the in-game Track page rather than changing it by hand.
Requirements = {"nextManualId":1,"manual":[],"overrides":[]}

; ------------------------------------------------------------------------------
; Naming and Localization
; ------------------------------------------------------------------------------

; Language:
;   Empty or "auto" = use the Windows user interface locale. (Default)
;   Otherwise use a BCP 47 language tag such as en, fr, de, zh-CN, zh-TW, ja, or ko.
;   The plugin loads locales/alchemist.<tag>.json beside alchemist.dll, then falls
;   back to the base language and English for missing or invalid entries.
Language =

; PotionPoison:
;   Prefixes applied to crafted potion and poison names. Format: "Potion prefix,Poison prefix"
PotionPoison = Potion of,Poison of

; ------------------------------------------------------------------------------
; Developer and Diagnostic Options
; ------------------------------------------------------------------------------

; developer:
;   0 = Normal gameplay mode. (Default)
;   1 = Enable the in-game Developer Test Hub for test fixtures and benchmarks.
developer = 0
