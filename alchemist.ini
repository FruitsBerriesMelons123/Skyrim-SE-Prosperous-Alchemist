; ==============================================================================
; Prosperous Alchemist NG — Configuration File
; ==============================================================================

[General]

; ------------------------------------------------------------------------------
; Calculation Settings
; ------------------------------------------------------------------------------

; IgnorePlayer:
;   0 = Use the player's Alchemy skill level, perks, and active Fortify Alchemy
;       equipment/potion buffs when calculating recipe values. (Default)
;   1 = Ignore player character stats and evaluate base recipe value.
IgnorePlayer = 0

; Singlethreaded:
;   0 = Recipe evaluation uses worker threads. (Default, recommended)
;   1 = Recipe evaluation runs on the main thread.
Singlethreaded = 0

; ProtectIngredients:
;   0 = Allow all ingredients in the player's inventory to be used in recipes. (Default)
;   1 = Exclude ingredients listed in ProtectedIngredients from recipe suggestions.
ProtectIngredients = 0

; ProtectedIngredients:
;   Comma-separated list of ingredients to exclude when ProtectIngredients=1.
;   Entries can be ingredient names, editor IDs, or hexadecimal FormIDs (e.g. 0x0001BCBC).
;   An optional quantity threshold (e.g. |3) preserves at least that many in inventory
;   while allowing surplus to be used.
ProtectedIngredients = Berit's Ashes,Bliss Bug Thorax|11,Bone Hawk Claw,Briar Heart|3,Corkbulb Root,Corrupted Human Heart,Crimson Nirnroot|31,Daedra Heart,Deathbell|32,Dragon's Tongue|11,Ectoplasm|11,Farengar's Frost Salt,Fine-Cut Void Salts,Fire Salts|21,Frost Mirriam|11,Frost Salts|11,Giant's Toe|3,Goldfish|2,Hagraven Claw|2,Hagraven Feathers|2,Human Heart,Ice Wraith Teeth|6,Ironwood Fruit|2,Jarrin Root,Jazbay Grapes|21,Juniper Berries|2,Juvenile Mudcrab|2,Large Antlers,Mudcrab Chitin,Netch Jelly|6,Nightshade|21,Nirnroot|21,Salt Pile|11,Scathecraw|11,Simon Rodayne's Heart,Slaughterfish Scales,Taproot|4,Torchbug Abdomen|11,Torchbug Thorax|11,Troll Fat|2,Vampire Dust|3,Void Salts|12

; ------------------------------------------------------------------------------
; Naming and Localization
; ------------------------------------------------------------------------------

; PotionPoison:
;   Prefixes applied to crafted potion and poison names. Format: "Potion prefix,Poison prefix"
PotionPoison = Potion of,Poison of

; ------------------------------------------------------------------------------
; Developer and Diagnostic Options
; ------------------------------------------------------------------------------

; developer:
;   0 = Normal gameplay mode. (Default)
;   1 = Enable the in-game Developer Test Hub for test fixtures, stress tests, and benchmarks.
developer = 0

; NumberOfIngredientsToStressTest:
;   0 = Normal operation. (Default)
;  >0 = Synthetic combination benchmark with N ingredients.
;  <0 = Normal operation; negative values are ignored.
NumberOfIngredientsToStressTest = 0
